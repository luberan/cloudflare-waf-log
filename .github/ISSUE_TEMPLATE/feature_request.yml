name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please keep in mind the project's scope (small dashboard, Free tier compatible, no build step, no database). See [CONTRIBUTING.md](../../blob/main/CONTRIBUTING.md#suggesting-features) for details.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not the solution. "I want to do X because Y."
      placeholder: When investigating a spike, I have to manually export and pivot CSV — it would be nice to …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Mockups or rough sketches welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, and why they fall short.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: Confirm this fits the project's scope.
      options:
        - label: This feature works on the Cloudflare Free tier (or is clearly marked as Pro+ only)
        - label: This feature does not require a build step or a database
        - label: I searched the existing issues and this is not a duplicate
          required: true
