name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and run tests
        run: npm run check
      - name: Build Worker without deploying
        run: npm run deploy:dry-run
      - name: Audit dependencies (high and critical)
        run: npm audit --audit-level=high
