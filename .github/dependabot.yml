# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "17 4 * * *"
    open-pull-requests-limit: 5
    # Do not adopt a release in its first days: most malicious npm publishes are detected and pulled
    # within that window. Security updates are not delayed by cooldown.
    cooldown:
      default-days: 3
    groups:
      # wrangler and @cloudflare/workers-types release almost daily and always move together.
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      test-tooling:
        patterns:
          - "vitest"
          - "jsdom"
          - "@playwright/test"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
